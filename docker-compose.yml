services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: token-sentry-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false   # runs without keys (CoinGecko/DexScreener/GoPlus free tiers)
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - token-sentry-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: token-sentry-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - token-sentry-network

networks:
  token-sentry-network:
    driver: bridge
